<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PiX'CRAFT</title>
  <link rel="icon" href="/img/favicon.ico" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Three.js + PointerLockControls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.154.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>
  <div id="start-screen" class="start-screen" role="main">
    <header class="header">
      <img src="/img/logo.png" alt="Logo PiX'CRAFT" class="logo" />
      <h1 class="game-title">PiX'CRAFT</h1>
    </header>

    <main class="main">
      <div class="menu" aria-label="Menu principal">
        <button id="play-btn" class="btn primary">JOUER</button>
        <button id="settings-btn" class="btn">PARAMÈTRES</button>
        <button id="shop-btn" class="btn">BOUTIQUE</button>
        <button id="account-btn" class="btn">COMPTE</button>
      </div>
      <div class="version">Bêta 3.2</div>
    </main>

    <div id="tips" class="tips" aria-live="polite"></div>
  </div>

  <!-- Play popup -->
  <div id="play-popup" class="popup-overlay" aria-hidden="true">
    <div class="popup play-popup" role="dialog" aria-modal="true">
      <h2>JOUER</h2>
      <div class="popup-actions">
        <button id="solo-btn" class="btn blocky">SOLO</button>
        <button id="multi-btn" class="btn blocky">MULTIJOUEUR</button>
        <button id="close-play-btn" class="btn blocky">FERMER</button>
      </div>
    </div>
  </div>

  <!-- Settings full screen -->
  <div id="settings-popup" class="settings-overlay" aria-hidden="true">
    <div class="settings-panel" role="dialog" aria-modal="true">
      <header class="settings-header">
        <h2>PARAMÈTRES</h2>
        <button id="close-settings" class="btn small blocky">FERMER</button>
      </header>

      <nav class="settings-tabs" role="tablist">
        <button class="tab active blocky" data-tab="audio">Audio</button>
        <button class="tab blocky" data-tab="video">Image</button>
        <button class="tab blocky" data-tab="controls">Contrôles</button>
        <button class="tab blocky" data-tab="version">Version</button>
      </nav>

      <section class="settings-content">
        <div class="tab-panel" id="audio">
          <label>Volume maître <input id="master-volume" type="range" min="0" max="100" value="80" /></label>
          <label>Musique <input id="music-volume" type="range" min="0" max="100" value="60" /></label>
        </div>

        <div class="tab-panel hidden" id="video">
          <label>Qualité graphique <select id="gfx-quality"><option>Faible</option><option>Moyenne</option><option>Élevée</option></select></label>
          <label><input id="pixelated" type="checkbox" checked /> Rendu pixelisé</label>
        </div>

        <div class="tab-panel hidden" id="controls">
          <p>Touches</p>
          <label>Avancer <input id="key-forward" value="Z" /></label>
          <label>Reculer <input id="key-back" value="S" /></label>
          <label>Gauche <input id="key-left" value="Q" /></label>
          <label>Droite <input id="key-right" value="D" /></label>
        </div>

        <div class="tab-panel hidden" id="version">
          <p>Bêta 3.2</p>
          <p>Build: prototype-pixcraft</p>
        </div>
      </section>
    </div>
  </div>

  <!-- In-game HUD (hidden until play) -->
  <div id="hud" class="hud hidden">
    <div id="crosshair" class="crosshair">+</div>
    <div id="hotbar" class="hotbar">
      <!-- hotbar slots -->
      <div class="slot selected" data-block="grass">Grass</div>
      <div class="slot" data-block="dirt">Dirt</div>
      <div class="slot" data-block="stone">Stone</div>
      <div class="slot" data-block="wood">Wood</div>
    </div>
    <div id="instructions" class="instructions">Click to place / remove blocks. WASD to move. Space to jump. Esc to unlock.</div>
  </div>

  <canvas id="game-canvas" class="game-canvas hidden"></canvas>

  <script src="script.js"></script>
</body>
</html>
