<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PiX'CRAFT</title>
  <link rel="icon" href="/img/favicon.ico" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Écran d'accueil -->
  <div id="start-screen" class="start-screen" role="main" aria-label="Écran d'accueil PiX'CRAFT">
    <header class="header">
      <img src="/img/logo.png" alt="Logo PiX'CRAFT" class="logo" />
      <h1 class="title">PiX'CRAFT</h1>
    </header>

    <main class="center-area">
      <nav class="menu" aria-label="Menu principal">
        <button id="play-btn" class="menu-btn">Jouer</button>
        <button id="settings-btn" class="menu-btn">Paramètres</button>
        <button id="shop-btn" class="menu-btn">Boutique</button>
        <button id="account-btn" class="menu-btn">Compte</button>
      </nav>

      <div class="meta">
        <div class="version">Bêta 3.2</div>
      </div>
    </main>

    <div id="tips" class="tips" aria-live="polite"></div>
  </div>

  <!-- Popup Jouer (statique, sans animation) -->
  <div id="play-popup" class="overlay" aria-hidden="true" role="dialog" aria-label="Choix de jeu">
    <div class="panel">
      <h2>Jouer</h2>
      <div class="panel-actions">
        <button id="solo-btn" class="panel-btn">Solo</button>
        <button id="multi-btn" class="panel-btn">Multijoueur</button>
        <button id="close-play-btn" class="panel-btn">Fermer</button>
      </div>
    </div>
  </div>

  <!-- Popup Paramètres plein écran (statique) -->
  <div id="settings-popup" class="settings-overlay" aria-hidden="true" role="dialog" aria-label="Paramètres">
    <div class="settings-panel">
      <header class="settings-header">
        <h2>Paramètres</h2>
        <button id="close-settings" class="panel-btn small">Fermer</button>
      </header>

      <nav class="settings-tabs" role="tablist" aria-label="Onglets paramètres">
        <button class="tab active" data-tab="audio" role="tab" aria-selected="true">Audio</button>
        <button class="tab" data-tab="video" role="tab">Image</button>
        <button class="tab" data-tab="controls" role="tab">Contrôles</button>
        <button class="tab" data-tab="version" role="tab">Version</button>
      </nav>

      <section class="settings-content">
        <div class="tab-panel" id="audio" role="tabpanel">
          <label>Volume maître <input id="master-volume" type="range" min="0" max="100" value="80" /></label>
          <label>Musique <input id="music-volume" type="range" min="0" max="100" value="60" /></label>
        </div>

        <div class="tab-panel hidden" id="video" role="tabpanel">
          <label>Résolution <select id="resolution"><option>Auto</option><option>1280x720</option><option>1920x1080</option></select></label>
          <label>Qualité graphique <select id="gfx-quality"><option>Faible</option><option>Moyenne</option><option>Élevée</option></select></label>
        </div>

        <div class="tab-panel hidden" id="controls" role="tabpanel">
          <p>Touches personnalisables</p>
          <label>Avancer <input id="key-forward" value="Z" /></label>
          <label>Reculer <input id="key-back" value="S" /></label>
          <label>Gauche <input id="key-left" value="Q" /></label>
          <label>Droite <input id="key-right" value="D" /></label>
        </div>

        <div class="tab-panel hidden" id="version" role="tabpanel">
          <p>Version du client</p>
          <p class="muted">Bêta 3.2</p>
          <p>Build: prototype-pixcraft</p>
        </div>
      </section>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
