<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BlockCraft Prototype</title>
  <link rel="icon" href="/img/favicon.ico" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="start-screen" class="start-screen">
    <header class="header">
      <img src="/img/logo.png" alt="Logo du jeu" class="logo" />
    </header>

    <main class="main">
      <div class="menu">
        <button id="play-btn" class="btn primary">Jouer</button>
        <button id="settings-btn" class="btn">Paramètres</button>
        <button id="shop-btn" class="btn">Boutique</button>
        <button id="account-btn" class="btn">Compte</button>
      </div>
      <div class="version">Bêta 3.2</div>
    </main>

    <div id="tips" class="tips" aria-live="polite"></div>
  </div>

  <!-- Play popup (hidden by default) -->
  <div id="play-popup" class="popup-overlay" aria-hidden="true">
    <div class="popup play-popup" role="dialog" aria-modal="true" aria-label="Choix de jeu">
      <h2>Jouer</h2>
      <div class="popup-actions">
        <button id="solo-btn" class="btn">Solo</button>
        <button id="multi-btn" class="btn">Multijoueur</button>
        <button id="close-play-btn" class="btn">Fermer</button>
      </div>
    </div>
  </div>

  <!-- Settings full screen popup -->
  <div id="settings-popup" class="settings-overlay" aria-hidden="true">
    <div class="settings-panel" role="dialog" aria-modal="true" aria-label="Paramètres">
      <header class="settings-header">
        <h2>Paramètres</h2>
        <button id="close-settings" class="btn small">Fermer</button>
      </header>

      <nav class="settings-tabs" role="tablist">
        <button class="tab active" data-tab="audio">Audio</button>
        <button class="tab" data-tab="video">Image</button>
        <button class="tab" data-tab="controls">Contrôles</button>
        <button class="tab" data-tab="version">Version</button>
      </nav>

      <section class="settings-content">
        <div class="tab-panel" id="audio">
          <label>Volume maître <input type="range" min="0" max="100" value="80" /></label>
          <label>Musique <input type="range" min="0" max="100" value="60" /></label>
        </div>

        <div class="tab-panel hidden" id="video">
          <label>Résolution <select><option>Auto</option><option>1280x720</option><option>1920x1080</option></select></label>
          <label>Qualité graphique <select><option>Faible</option><option>Moyenne</option><option>Élevée</option></select></label>
        </div>

        <div class="tab-panel hidden" id="controls">
          <p>Touches personnalisables</p>
          <label>Avancer <input value="Z" /></label>
          <label>Reculer <input value="S" /></label>
          <label>Gauche <input value="Q" /></label>
          <label>Droite <input value="D" /></label>
        </div>

        <div class="tab-panel hidden" id="version">
          <p>Version du client</p>
          <p class="muted">Bêta 3.2</p>
          <p>Notes de version et informations de build seront affichées ici.</p>
        </div>
      </section>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
